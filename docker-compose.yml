# Локальное окружение для разработки. В продакшене — управляемые сервисы
# у облачного провайдера с дата-центрами в России.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Миграции применяет сам сервер при запуске (таблица schema_migrations).

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
