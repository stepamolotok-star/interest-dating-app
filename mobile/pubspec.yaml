name: svoi
description: "Свои — найди своих людей по интересам."
publish_to: 'none'
version: 0.1.12+13

environment:
  sdk: ^3.14.0

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_contacts: ^2.6.0
  flutter_displaymode: ^0.7.0
  flutter_web_auth_2: ^5.1.0
  geolocator: ^14.1.2
  http: ^1.6.0
  material_ui: ^1.1.0
  phone_state: ^4.0.1
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/catalog.json
    - assets/data/cities.json

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-700.ttf
          weight: 700
